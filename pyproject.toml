[project]
name = "rustipy"
version = "0.2.3"
description = "Rustipy your python project"
authors = [
    {name = "Siyoung September", email = "loldruger@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.20",
    "ty>=0.0.56",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "integrated_test.py"]
python_functions = "test_*"

[build-system]
requires = ["uv_build>=0.11.26,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.20",
    "ty>=0.0.56",
]
